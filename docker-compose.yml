services:
  homeapp-backend:
    build:
      context: ./backend
    container_name: homeapp-backend
    restart: unless-stopped
    mem_limit: 256m
    environment:
      HOME_APP_TOKEN: ${HOME_APP_TOKEN}
      N8N_YT_WEBHOOK: ${N8N_YT_WEBHOOK:-http://n8n:5678/webhook/yt}
      N8N_MAGNET_WEBHOOK: ${N8N_MAGNET_WEBHOOK:-http://n8n:5678/webhook/magnet}
      APP_VERSION: ${APP_VERSION:-0.2.2}
      TZ: ${TZ:-Europe/Moscow}
      QB_URL: ${QB_URL:-http://qbittorrent:8080}
      QB_USERNAME: ${QB_USERNAME:-}
      QB_PASSWORD: ${QB_PASSWORD:-}
      QB_BYPASS_AUTH: ${QB_BYPASS_AUTH:-true}
      METUBE_URL: ${METUBE_URL:-http://metube:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8091}
      HOST_ROOT_PATH: ${HOST_ROOT_PATH:-/host}
      HOST_PROC_PATH: ${HOST_PROC_PATH:-/host/proc}
      HOST_SYS_PATH: ${HOST_SYS_PATH:-/host/sys}
      HOME_DATA_PATH: ${HOME_DATA_PATH:-/host/home/igor/server}
      HOME_DATA_ROOT: ${HOME_DATA_ROOT:-/data}
      MEDIA_PATH: ${MEDIA_PATH:-/data/media}
      MUSIC_PATH: ${MUSIC_PATH:-/data/music}
      TORRENTS_PATH: ${TORRENTS_PATH:-/data/torrents}
      YOUTUBE_PATH: ${YOUTUBE_PATH:-/data/youtube}
      BOOKS_PATH: ${BOOKS_PATH:-/data/books}
      ALLOW_FILE_DELETE: ${ALLOW_FILE_DELETE:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERT_CPU_PERCENT: ${ALERT_CPU_PERCENT:-90}
      ALERT_MEMORY_PERCENT: ${ALERT_MEMORY_PERCENT:-90}
      ALERT_SWAP_PERCENT: ${ALERT_SWAP_PERCENT:-70}
      ALERT_DISK_PERCENT: ${ALERT_DISK_PERCENT:-90}
      ALERT_TEMPERATURE_C: ${ALERT_TEMPERATURE_C:-80}
      ALERT_CHECK_INTERVAL_SECONDS: ${ALERT_CHECK_INTERVAL_SECONDS:-60}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-1800}
      ALERT_SERVICE_FAILURES: ${ALERT_SERVICE_FAILURES:-2}
      HEALTH_URL_JELLYFIN: ${HEALTH_URL_JELLYFIN:-http://jellyfin:8096}
      HEALTH_URL_NAVIDROME: ${HEALTH_URL_NAVIDROME:-http://navidrome:4533}
      HEALTH_URL_QBITTORRENT: ${HEALTH_URL_QBITTORRENT:-http://qbittorrent:8080}
      HEALTH_URL_METUBE: ${HEALTH_URL_METUBE:-http://metube:8081}
      HEALTH_URL_N8N: ${HEALTH_URL_N8N:-http://n8n:5678}
      HEALTH_URL_FILE_BROWSER: ${HEALTH_URL_FILE_BROWSER:-http://filebrowser:80}
      HEALTH_URL_HOMEPAGE: ${HEALTH_URL_HOMEPAGE:-http://homepage:3000}
      EVENTS_PATH: /app/app_data/events.json
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_HOST_PATH:-/home/igor/server/media}:/data/media
      - ${MUSIC_HOST_PATH:-/home/igor/server/music}:/data/music
      - ${TORRENTS_HOST_PATH:-/home/igor/server/torrents}:/data/torrents
      - ${YOUTUBE_HOST_PATH:-/home/igor/server/youtube}:/data/youtube
      - ${BOOKS_HOST_PATH:-/home/igor/server/books}:/data/books
      - ./backend/app_data:/app/app_data
    ports:
      - "8090:8000"
    networks:
      - server_default

  homeapp-frontend:
    build:
      context: ./frontend
    container_name: homeapp-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - homeapp-backend
    ports:
      - "8091:80"
    networks:
      - server_default

networks:
  server_default:
    external: true
